name: Sync YouTube Episodes

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── RSS sync (no API key needed — always runs) ──
      - name: Sync episodes via RSS (no API key required)
        id: rss_sync
        run: |
          node scripts/sync-rss.js || EXIT=$?
          if [ "${EXIT:-0}" = "2" ]; then
            echo "rss_changed=false" >> "$GITHUB_OUTPUT"
          elif [ "${EXIT:-0}" = "0" ]; then
            echo "rss_changed=true" >> "$GITHUB_OUTPUT"
          else
            exit $EXIT
          fi
        continue-on-error: false

      # ── Full API sync (runs only when API key is set — adds view counts + durations) ──
      - name: Sync episodes via YouTube API (if key configured)
        if: env.YOUTUBE_API_KEY != ''
        run: |
          node scripts/sync-youtube.js || true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # ── Commit any changes ──
      - name: Commit updated data.js
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): sync episodes from YouTube [skip ci]"
            git push
          fi
