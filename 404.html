<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Redirecting · The Sector Debrief</title>
  <meta name="robots" content="noindex"/>
  <!-- Fallback redirect if JS is disabled -->
  <meta http-equiv="refresh" content="2;url=/"/>
  <script>
    (function(){
      var seg = location.pathname
        .replace(/^\//, '')
        .replace(/\/$/, '')
        .split('/')[0]
        .toLowerCase();
      var valid = ['home','episodes','blog','about','contact'];
      var hash = valid.indexOf(seg) >= 0 ? '#' + seg : '#home';
      location.replace('/' + hash);
    })();
  </script>
  <style>
    body { font-family: system-ui, sans-serif; background: #EFE8D6; color: #1A1614; padding: 60px 32px; text-align: center; }
    a { color: #2C5BAA; }
  </style>
</head>
<body>
  <h1>Redirecting&hellip;</h1>
  <p>If you aren't redirected, <a href="/">go to the home page</a>.</p>
</body>
</html>
