<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Redirecting · The Sector Debrief</title>
  <meta name="robots" content="noindex"/>
  <script>
    // GitHub Pages serves this for any unknown path. Map common SPA paths
    // (/about, /episodes, /blog, /contact) to the corresponding hash route
    // on the home page so deep links from old URLs / external sites still
    // land somewhere useful.
    (function(){
      var seg = location.pathname
        .replace(/^\/the-sector-debrief\//, '')
        .replace(/\/$/, '')
        .split('/')[0]
        .toLowerCase();
      var valid = ['home','episodes','blog','about','contact'];
      var hash = valid.indexOf(seg) >= 0 ? '#' + seg : '#home';
      location.replace('/the-sector-debrief/' + hash);
    })();
  </script>
  <style>
    body { font-family: system-ui, sans-serif; background: #EFE8D6; color: #1A1614; padding: 60px 32px; text-align: center; }
    a { color: #2C5BAA; }
  </style>
</head>
<body>
  <h1>Redirecting…</h1>
  <p>If you aren't redirected, <a href="/the-sector-debrief/">go to the home page</a>.</p>
</body>
</html>
